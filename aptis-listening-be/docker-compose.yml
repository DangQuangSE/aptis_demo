version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: aptis_listening_db
    environment:
      POSTGRES_DB: aptis_listening
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aptis_listening"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
