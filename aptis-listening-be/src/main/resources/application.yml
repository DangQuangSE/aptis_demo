server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: aptis-listening

  datasource:
    url: jdbc:h2:mem:aptis_listening;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  gemini:
    api.key: AIzaSyDE28oSu1QMw9CLfRb9R-dMSoWMNFxbUb0
